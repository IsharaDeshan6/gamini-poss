<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamini Stores POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f5;--card:#fff;--tx:#1b2420;--mut:#66726c;--bd:#e0e5e2;--ac:#15803d;--acs:#e6f3ea;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121715;--card:#1b2220;--tx:#e8eeea;--mut:#9aa8a1;--bd:#2c3631;--ac:#4ade80;--acs:#1d3025;--bad:#f87171;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121715;--card:#1b2220;--tx:#e8eeea;--mut:#9aa8a1;--bd:#2c3631;--ac:#4ade80;--acs:#1d3025;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif;display:flex}
aside{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;overflow:auto}
.logo{font-weight:600;font-size:16px;color:var(--ac);padding:4px 8px}.logo small{display:block;color:var(--mut);font:400 12px 'Noto Sans Sinhala'}
aside button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--mut)}
aside button:hover{background:var(--bg)}aside button.on{background:var(--acs);color:var(--ac);font-weight:600}
aside button.pos{background:var(--ac);color:#fff;font-weight:600;margin-bottom:6px;text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0}#view{padding:16px 20px;overflow:auto;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.k{color:var(--mut);font-size:12px}.v{font-size:20px;font-weight:600;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12px}
.r{text-align:right}input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;min-width:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--mut);padding:9px 22px;font:600 13px Inter;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.pos{display:grid;grid-template-columns:1fr 520px;gap:14px;height:100%}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;overflow:auto;max-height:calc(100vh - 230px)}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;text-align:left}.pc:hover{border-color:var(--ac)}
.ln{border-bottom:1px solid var(--bd);padding:8px 0;display:grid;gap:4px}.ln .row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ln input{width:78px}.mut{color:var(--mut);font-size:12px}.good{color:var(--ac)}.bad{color:var(--bad)}
.tag{background:var(--acs);color:var(--ac);padding:2px 8px;border-radius:20px;font-size:12px}.tag.w{background:#fde8e8;color:var(--bad)}
#toast{position:fixed;right:20px;bottom:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:99}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;overflow:auto;padding:20px}
#rc{background:#fff;color:#000;padding:12px;font:13px 'Noto Sans Sinhala',monospace;margin:auto}#rc pre{font:inherit;margin:0;white-space:pre-wrap}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:4px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important;padding:0}.np{display:none!important}}
.toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center}.toolbar input{width:280px}
.pos{grid-template-columns:1fr 470px!important}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 14px;cursor:pointer;font:inherit}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pc{position:relative;display:grid;gap:3px;padding:12px!important}.av{width:34px;height:34px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:600;margin-bottom:4px}.pp{font-weight:600;color:var(--ac);font-size:15px;margin-top:4px}
.cth{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:15px}.big{background:var(--ac);color:#fff;border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;font-size:22px;font-weight:600}
.hb{display:grid;grid-template-columns:120px 1fr 100px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.hb i{display:block;height:12px;background:var(--ac);border-radius:6px}.hb b{text-align:right;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<aside id="nav"></aside>
<main><header><h1 id="ttl"></h1><div style="display:flex;gap:14px;align-items:center"><span class="mut" id="clk"></span><button class="btn o" onclick="theme()">Theme</button><span class="tag">Owner</span></div></header><div id="view"></div></main>
<div id="toast"></div><div id="modal"><div><div id="rc"></div><div class="np" style="text-align:center;margin-top:10px;display:flex;gap:8px;justify-content:center"><button class="btn" onclick="window.print()">Print</button><button class="btn o" style="background:var(--card)" onclick="$('#modal').style.display='none'">Close / New sale</button></div></div></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const f=n=>'Rs. '+(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ds=d=>{d=new Date(d);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())};
const K='gamini-pos-v1';let S,V='cashier',MODE='R',CART=[],BD=0,PAY='Cash',RECV='',Q='',DRAFT=[];
const P0=[['Biscuit','බිස්කට්','123456789','Biscuits',50,80,70,100],['Milk Powder 400g','කිරි පිටි','4791001000012','Dairy',1000,1200,1150,50],['Soap','සබන්','4791001000029','Toiletries',100,150,135,80],['Sugar 1kg','සීනි','4791001000036','Groceries',200,240,225,120],['Rice 1kg','සහල්','4791001000043','Groceries',180,220,210,100],['Tea 200g','තේ කොළ','4791001000050','Beverages',380,450,430,60],['Shampoo 180ml','ෂැම්පු','4791001000067','Toiletries',180,250,230,40],['Bottled Water 1L','වතුර බෝතලය','4791001000074','Beverages',70,100,90,90],['Soft Drink 1.5L','බීම','4791001000081','Beverages',230,300,280,45],['Instant Noodles','නූඩ්ල්ස්','4791001000098','Groceries',90,130,120,8],['Coconut Oil 1L','පොල්තෙල්','4791001000104','Groceries',650,780,750,30],['Wheat Flour 1kg','පිටි','4791001000111','Groceries',190,230,215,70]];
function seed(){const t=Date.now(),pr=P0.map((p,i)=>({id:i+1,name:p[0],si:p[1],barcode:p[2],cat:p[3],retail:p[5],wholesale:p[6],min:15,batches:[{no:'Batch 001',qty:p[7],cost:p[4],date:ds(t-864e5*20)}]}));
let sales=[],n=0;for(let d=6;d>=0;d--)for(let k=0;k<3;k++){const a=pr[(d*3+k)%12],b=pr[(d*3+k+4)%12],m=(d+k)%3==0?'W':'R',L=[a,b].map((p,j)=>{const q=1+(d+j+k)%3,pp=m=='R'?p.retail:p.wholesale;return{n:p.name,si:p.si,q,p:pp,d:0,c:q*p.batches[0].cost}});const tot=L.reduce((s,l)=>s+l.p*l.q,0);n++;sales.push({inv:'GS'+String(n).padStart(5,'0'),dt:t-864e5*d-k*36e5,mode:m,lines:L,bd:0,total:tot,method:['Cash','Card','Cash'][k],paid:tot,change:0})}
return{products:pr,suppliers:[{id:1,name:'Ceylon Foods Distributors',tel:'011 2 345 678',addr:'Pettah, Colombo 11'},{id:2,name:'Lanka Wholesale Traders',tel:'077 123 4567',addr:'Kandy Rd, Kadawatha'}],purchases:[{no:'PUR-0001',sup:'Ceylon Foods Distributors',date:ds(t-864e5*20),n:12,total:73200,status:'Paid'}],sales,rs:'80'}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'#b91c1c':'';t.style.color=bad?'#fff':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
const stock=p=>p.batches.reduce((s,b)=>s+b.qty,0),prod=id=>S.products.find(p=>p.id==id);
function fifo(p,q){let r=q,c=0;for(const b of p.batches){const t=Math.min(r,b.qty);c+=t*b.cost;r-=t;if(!r)break}return c}
function theme(){const r=document.documentElement,d=getComputedStyle(r).colorScheme=='dark';r.dataset.theme=d?'light':'dark'}
const NAV=[['dashboard','Dashboard'],['cashier','Cashier / POS'],['products','Products'],['categories','Categories'],['stock','Stock & Batches'],['purchases','Purchases'],['sales','Sales & Bills'],['reports','Reports'],['settings','Settings']];
function go(v){V=v;$('#nav').innerHTML='<div class="logo">GAMINI STORES<small>ගාමිණී ස්ටෝර්ස්</small></div>'+NAV.map(n=>`<button class="${n[0]==v?'on':''} ${n[0]=='cashier'?'pos':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('#ttl').textContent=NAV.find(n=>n[0]==v)[1];R[v]();}
setInterval(()=>{$('#clk').textContent=new Date().toLocaleString('en-GB')},1000);
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const profit=s=>s.total-s.lines.reduce((a,l)=>a+l.c,0);
const R={};
R.dashboard=()=>{const td=ds(Date.now()),T=S.sales.filter(s=>ds(s.dt)==td),sum=a=>a.reduce((x,s)=>x+s.total,0),low=S.products.filter(p=>stock(p)<=p.min);
const days=[...Array(7)].map((_,i)=>{const d=ds(Date.now()-864e5*(6-i));return[d.slice(5),sum(S.sales.filter(s=>ds(s.dt)==d))]}),mx=Math.max(1,...days.map(d=>d[1])),top={};S.sales.forEach(s=>s.lines.forEach(l=>top[l.n]=(top[l.n]||0)+l.q));
const card=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
$('#view').innerHTML=`<div class="grid g4">${card("Today's sales",f(sum(T)))}${card('Bills today',T.length)}${card("Today's gross profit",f(T.reduce((a,s)=>a+profit(s),0)))}${card('Total products',S.products.length)}${card('Low-stock products',low.length)}${card('Retail today',f(sum(T.filter(s=>s.mode=='R'))))}${card('Wholesale today',f(sum(T.filter(s=>s.mode=='W'))))}</div>
<div class="grid g2" style="margin-top:12px"><div class="card"><b>Sales – last 7 days</b><div class="bars" style="margin-top:12px">${days.map(d=>`<div><i style="height:${d[1]/mx*110}px"></i>${d[0]}</div>`).join('')}</div></div>
<div class="card"><b>Top-selling products</b>${tbl(['Product','Qty'],Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5))}</div>
<div class="card"><b>Low stock</b>${tbl(['Product','Stock'],low.map(p=>[p.name,`<span class="bad">${stock(p)}</span>`]))}</div>
<div class="card"><b>Recent transactions</b>${tbl(['Invoice','Mode','Total'],S.sales.slice(-5).reverse().map(s=>[s.inv,s.mode=='R'?'Retail':'Wholesale',f(s.total)]))}</div></div>`};
/* ---- cashier ---- */
function price(p){return MODE=='R'?p.retail:p.wholesale}
function addToCart(id){const p=prod(id),c=CART.find(x=>x.id==id),q=c?c.q:0;if(q+1>stock(p))return toast('Insufficient stock for '+p.name,1);if(c)c.q++;else CART.push({id,q:1,p:price(p),d:0});drawCart()}
function scan(e){if(e.key!='Enter')return;const v=e.target.value.trim(),p=S.products.find(x=>x.barcode==v);e.target.value='';if(!p)return toast('Unknown barcode: '+v,1);addToCart(p.id);toast('Added '+p.name)}
function setMode(m){MODE=m;CART.forEach(c=>c.p=price(prod(c.id)));R.cashier()}
function totals(){let sub=0,pr=0;CART.forEach(c=>{const p=prod(c.id),cost=fifo(p,c.q),net=c.p*c.q-c.d;c.cost=cost;c.net=net;sub+=net;pr+=net-cost});return{sub,tot:Math.max(0,sub-BD),pr:pr-BD}}
function drawGrid(){const q=Q.toLowerCase();$('#grid').innerHTML=S.products.filter(p=>!q||p.name.toLowerCase().includes(q)||p.barcode.includes(q)||p.si.includes(q)).map(p=>`<button class="pc" onclick="addToCart(${p.id})"><b>${p.name}</b><div class="mut">${p.si}</div><div style="margin-top:6px">${f(price(p))}</div><div class="mut">Stock: ${stock(p)}</div></button>`).join('')}
function drawCart(){const T=totals();$('#cart').innerHTML=(CART.length?CART.map((c,i)=>{const p=prod(c.id),uc=c.cost/c.q,pu=c.p-uc-c.d/c.q,ed=MODE=='W'||c.sp;return`<div class="ln"><div class="row"><b>${p.name}</b><button class="btn o" onclick="CART.splice(${i},1);drawCart()">✕</button></div>
<div class="mut">Cost ${f(uc)} · Retail ${f(p.retail)} · Wholesale ${f(p.wholesale)}</div>
<div class="row"><span>${MODE=='W'?'Wholesale':c.sp?'Special':'Retail (fixed)'} ${ed?`<input type="number" min="0" value="${c.p}" onchange="CART[${i}].p=Math.max(0,+this.value);drawCart()">`:`<b>${f(c.p)}</b>`}</span><span>Disc <input type="number" value="${c.d}" onchange="CART[${i}].d=+this.value;drawCart()"></span>
<span><button class="btn o" onclick="qty(${i},-1)">−</button> <b>${c.q}</b> <button class="btn o" onclick="qty(${i},1)">+</button></span><b>${f(c.net)}</b></div>
<div class="row"><span class="${pu<0?'bad':'good'}">Profit/unit ${f(pu)} · Total ${f(c.net-c.cost)}</span>${c.p<uc?'<span class="tag w">Below cost!</span>':''}${MODE=='R'?`<button class="btn o" onclick="CART[${i}].sp=!CART[${i}].sp;if(!CART[${i}].sp)CART[${i}].p=prod(CART[${i}].id).retail;drawCart()">${c.sp?'Reset to retail':'Special price'}</button>`:`<button class="btn o" onclick="saveW(${i})">Update product wholesale price</button>`}</div></div>`}).join(''):'<p class="mut">Cart is empty. Scan a barcode or tap a product.</p>')+
`<div class="row" style="margin-top:10px"><span>Subtotal</span><b>${f(T.sub)}</b></div><div class="row"><span>Bill discount</span><input type="number" value="${BD}" onchange="BD=+this.value;drawCart()"></div>
<div class="row" style="font-size:18px"><b>Total</b><b>${f(T.tot)}</b></div><div class="row good"><span>Gross profit (internal)</span><b>${f(T.pr)}</b></div>
<div class="row" style="margin-top:8px"><select onchange="PAY=this.value;drawCart()">${['Cash','Card','Bank transfer'].map(m=>`<option ${m==PAY?'selected':''}>${m}</option>`).join('')}</select>
${PAY=='Cash'?`<input id="rv" type="number" placeholder="Received" value="${RECV}" oninput="RECV=this.value;chg()">`:''}</div><div class="row"><span>Change</span><b id="chg"></b></div>
<button class="btn" id="done" style="width:100%;margin-top:10px;padding:12px" onclick="checkout()">Complete sale</button>`;chg()}
function chg(){const T=totals(),e=$('#chg');if(!e)return;const ok=CART.length&&(PAY!='Cash'||+RECV>=T.tot);e.textContent=PAY=='Cash'?f(Math.max(0,(+RECV||0)-T.tot)):'—';$('#done').disabled=!ok}
function qty(i,d){const c=CART[i],p=prod(c.id),n=c.q+d;if(n<1)return CART.splice(i,1),drawCart();if(n>stock(p))return toast('Only '+stock(p)+' in stock',1);c.q=n;drawCart()}
function checkout(){const T=totals();for(const c of CART)if(c.q>stock(prod(c.id)))return toast('Insufficient stock',1);if(PAY=='Cash'&&+RECV<T.tot)return toast('Received amount is insufficient',1);
const lines=CART.map(c=>{const p=prod(c.id);return{n:p.name,si:p.si,q:c.q,p:c.p,d:c.d,c:fifo(p,c.q)}});
CART.forEach(c=>{let r=c.q;for(const b of prod(c.id).batches){const t=Math.min(r,b.qty);b.qty-=t;r-=t;if(!r)break}});
const paid=PAY=='Cash'?+RECV:T.tot,s={inv:'GS'+String(S.sales.length+1).padStart(5,'0'),dt:Date.now(),mode:MODE,lines,bd:BD,total:T.tot,method:PAY,paid,change:paid-T.tot};
S.sales.push(s);save();CART=[];BD=0;RECV='';toast('Sale completed: '+s.inv);R.cashier();receipt(s)}
R.cashier=()=>{$('#view').innerHTML=`<div class="pos"><div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg"><button class="${MODE=='R'?'on':''}" onclick="setMode('R')">RETAIL</button><button class="${MODE=='W'?'on':''}" onclick="setMode('W')">WHOLESALE</button></div><span class="tag">${MODE=='R'?'Retail pricing':'Wholesale pricing'}</span>
<input id="bc" placeholder="Scan barcode + Enter (try 123456789)" onkeydown="scan(event)" style="flex:1;min-width:180px"><input placeholder="Search product" oninput="Q=this.value;drawGrid()" value="${Q}"></div><div class="prods" id="grid"></div></div>
<div class="card" id="cart" style="overflow:auto;max-height:calc(100vh - 110px)"></div></div>`;drawGrid();drawCart();$('#bc').focus()};
/* ---- receipt ---- */
function receipt(s){const w=S.rs=='58'?'58mm':'80mm',n=S.rs=='58'?32:42,d=new Date(s.dt),ln='-'.repeat(n),r=(a,b,c)=>(a+' ').slice(0,n-18).padEnd(n-18)+String(b).padStart(5)+String(c).padStart(13);
const disc=s.bd+s.lines.reduce((a,l)=>a+l.d,0),t=n=>(+n).toFixed(2);
$('#rc').style.width=w;$('#rc').innerHTML=`<pre style="text-align:center;font-weight:600;font-size:16px">ගාමිණී ස්ටෝර්ස්</pre><pre style="text-align:center">අංක 12, මල්වත්ත පාර, කොළඹ\n011 2 345 678</pre><pre>
බිල්පත් අංකය: ${s.inv}
දිනය: ${ds(d)}
වේලාව: ${d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
බිල්පත් වර්ගය: ${s.mode=='R'?'සිල්ලර මිල':'තොග මිල'}
${ln}
${r('භාණ්ඩය','ප්‍රමාණය','එකතුව')}
${ln}
${s.lines.map(l=>r(l.si||l.n,l.q,t(l.p*l.q-l.d))).join('\n')}
${ln}
මුළු එකතුව: රු. ${t(s.total)}
වට්ටම: රු. ${t(disc)}
ගෙවූ මුදල: රු. ${t(s.paid)}
ඉතිරි මුදල: රු. ${t(s.change)}
